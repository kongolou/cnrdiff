[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cnrdiff"
dynamic = ["version"]
description = "A library used to compare signal-to-noise ratio.（卫星载噪比差值比较）"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sheng Guoliang", email = "shengguoliang@sinognss.com"},
    {name = "Yang Fawang", email = "yangfawang@sinognss.com"},
]
keywords = ["cnr", "signal-to-noise", "gnss", "rinex", "bnc"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas>=2.0.0",
    "pyrtcm>=1.0.0",
]

[project.scripts]
cnrdiff = "cnrdiff.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "cnrdiff.__version__"}
